[project]
name = "smartschedule"
version = "0.0.0"
description = "Python port of the Domain Drivers course code (SmartSchedule)"
authors = [{ name = "Sebastian Buczyński", email = "nnplaya@gmail.com" }]
license = "GPL-3.0-only"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "python-dateutil",
    "sqlalchemy",
    "pydantic-settings",
    "fastapi[all]",
    "pydantic",
    "lagom",
    "psycopg2-binary",
    "redis",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "factory-boy",
    "tach",
    "types-python-dateutil",
    "testcontainers[postgres,redis]",
    "mockito",
    "pytest-mockito",
    "time-machine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smartschedule"]
